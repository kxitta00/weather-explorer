<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherApp</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
</head>

<body>
  <!-- Header -->
  <header class="weather-header">
    <!-- Logo -->
    <div class="logo">
      <img src="logo.svg" alt="Logo" width="28" height="28">
      <span class="logo-title">Weather Explorer</span>
    </div>
    <!-- Search-Box -->
    <form id="search-form" class="search-box">
      <button type="submit" id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
      <input type="text" id="search-input" placeholder="ค้นหาเมือง เช่น นครราชสีมา, Tokyo">
    </form>
    <!-- Favorite-Button -->
    <div id="favorite-chips" class="favorite-chips">
    </div>
  </header>
  <!-- Header -->

  <!-- Main -->
  <main>
    <div class="status-container" id="status-container"></div>
    <!-- hero -->
    <section class="hero-card" id="hero-weather">
      <!--left -->
      <div class="city-main">
        <div class="city-header">
          <div class="city-name_btn-fav">
            <h1 class="city-name" id="city-name"></h1>
            <button class="city-fav-btn" id="fav-toggle-btn"><i class="fa-solid fa-location-dot"></i>
              <span>เพิ่มในรายการโปรด</span>
            </button>
          </div>
          <p class="date" id="current-date"></p>
        </div>

        <div class="now">
          <span class="temp" id="current-temp"></span><sup>°C</sup>
          <i class="fa-solid fa-cloud-sun weather-hero-icon"></i>
        </div>
        <p class="weather-desc" id="weather-condition"></p>
      </div>
      <!-- right -->
      <div class="metrics-grid">
        <div class="metric-card">
          <span class="metric-label">ความชื้น</span>
          <span class="metric-value" id="humidity-val"></span>
          <span class="metric-desc" id="humidity-desc">ค่อนข้างชื้น</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">ความเร็วลม</span>
          <span class="metric-value" id="wind-val"></span>
          <span class="metric-desc" id="wind-desc">ลมเบา</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">รู้สึกเหมือน</span>
          <span class="metric-value" id="feels-like-val"></span>
          <span class="metric-desc" id="feels-like-desc">ร้อนอบอ้าว</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">ดัชนี UV</span>
          <span class="metric-value" id="uv-val"></span>
          <span class="metric-desc" id="uv-desc">สูงมาก</span>
        </div>
      </div>
    </section>
    <section class="stats-summary" id="stats-summary">
      <div class="stats-card">
        <div class="stat-icon01">🔺</div>
        <div class="stats-content">
          <span class="stat-label">สูงสุดของสัปดาห์</span>
          <span class="stat-value" id="weekly-max">35°C</span>
        </div>
      </div>
      <div class="stats-card">
        <div class="stat-icon02">🔻</div>
        <div class="stats-content">
          <span class="stat-label">ต่ำสุดของสัปดาห์</span>
          <span class="stat-value" id="weekly-min">25°C</span>
        </div>
      </div>
      <div class="stats-card">
        <div class="stat-icon03">〰️</div>
        <div class="stats-content">
          <span class="stat-label">เฉลี่ยของสัปดาห์</span>
          <span class="stat-value" id="weekly-avg">29.6°C</span>
        </div>
      </div>

    </section>
    <h2 class="forecast-title">พยากรณ์ 7 วัน</h2>
    <section class="forecast-grid" id="forecast-grid">
    </section>
  </main>
  <footer>
    <div class="footer-container">
      <span class="footer-cradit">© 2026 Weather Explorer | พัฒนาโดย Kxitta</span>
      <span class="footer-api">ข้อมูลสภาพอากาศให้บริการโดย Open-Meteo API</span>
    </div>
  </footer>
  <script type="module" src="src/main.ts"></script>
</body>

</html>
